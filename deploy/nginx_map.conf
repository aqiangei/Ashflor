# Include once in http { } — routes WebSocket / HTTP by ?v=VERSION_HASH
# Map files are written by deploy.sh into Server/build/nginx/

map $arg_v $ashflor_port {
    include /path/to/ashflor/Server/build/nginx/*.conf;
}

map $uri $ashflor_cache_control {
    /       "no-cache";
    default "private, max-age=31536000";
}
