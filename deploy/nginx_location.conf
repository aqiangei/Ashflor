# Include inside server { } for ashflor.com (adjust path / SSL as needed)
# Requires http{} zones (see nginx-ashflor.conf): ashflor_conn / ashflor_req
# and map $http_x_real_ip $ashflor_client_ip.

location / {
    add_header Cache-Control $ashflor_cache_control;
    proxy_pass http://127.0.0.1:$ashflor_port;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $ashflor_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    limit_conn ashflor_conn 30;
    limit_req zone=ashflor_req burst=60 nodelay;
}
