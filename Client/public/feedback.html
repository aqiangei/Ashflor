<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>给作者留言 · Ashflor</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#344734;background:#f6f3df;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#e1edc5,transparent 65%);min-height:100vh}main{max-width:1020px;margin:auto;padding:28px 24px 56px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:30px}.brand{font-weight:800;letter-spacing:.1em;color:#496a3e}a{color:#376d4b}button,.button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:650;background:#e6e9d4;color:#344734;text-decoration:none}button:hover,.button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #84ad57;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.intro{margin:12px 0 26px}.eyebrow{font-size:13px;color:#54754a;font-weight:700;letter-spacing:.1em}h1{font-size:clamp(30px,5vw,42px);margin:8px 0 12px;letter-spacing:-.03em}.intro p{line-height:1.8;color:#61705a;margin:0}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}.panel{border:1px solid #d9dfc4;background:#fffcf0;border-radius:20px;box-shadow:0 5px 0 #dce3c2;padding:24px}.composer{position:sticky;top:20px}h2{font-size:19px;margin:0 0 16px}.small{font-size:13px;line-height:1.7;color:#65735e}.identity{font-size:14px;margin-bottom:16px}.identity strong{color:#386743}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}textarea{width:100%;resize:vertical;min-height:175px;border:1px solid #c9d4b5;border-radius:12px;padding:13px;font:inherit;font-size:15px;line-height:1.7;background:#fffef7;color:#344734}textarea::placeholder{color:#909983}.count{text-align:right;font-size:12px;color:#7c8970;margin:6px 0 16px}.send{width:100%;background:#547d46;color:white;box-shadow:0 3px 0 #365d2c}.status{min-height:24px;font-size:14px;line-height:1.6;margin:14px 0 0;overflow-wrap:anywhere}.status.error{color:#a24f37}.public{border-top:1px solid #e2e6d2;padding-top:16px;margin-top:18px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.list-head h2{margin:0}.refresh{font-size:13px;padding:8px 12px}.message{border-bottom:1px solid #e1e6d1;padding:19px 0}.message:first-child{padding-top:8px}.message:last-child{border-bottom:0;padding-bottom:6px}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:12px;color:#7d886f}.author{font-size:14px;font-weight:750;color:#42603b}.message p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.8;margin:10px 0 0}.empty{padding:36px 10px;text-align:center;color:#7b886d;line-height:1.8}.older{display:block;margin:20px auto 0}.older[hidden]{display:none}footer{margin-top:30px;font-size:12px;color:#7d886f;text-align:center;line-height:1.8}footer a{margin:0 6px}@media(max-width:700px){main{padding:20px 16px 36px}header{padding-bottom:18px}.layout{grid-template-columns:1fr;gap:20px}.composer{position:static}.panel{padding:20px}.intro{margin-top:8px}textarea{min-height:130px}.intro p{font-size:14px}}
</style>
<main>
  <header><span class="brand">ASHFLOR · 灰烬</span><button type="button" id="back">返回游戏 ↗</button></header>
  <section class="intro"><span class="eyebrow">一起让花园变得更好</span><h1>给作者留言</h1><p>遇到的问题、游玩的建议，或者想说的话，都可以留在这里。</p></section>
  <div class="layout">
    <section class="panel composer" aria-labelledby="compose-title">
      <h2 id="compose-title">写一条留言</h2>
      <div class="identity" id="identity">从游戏中登录后即可留言</div>
      <form id="form"><label for="message">留言内容</label><textarea id="message" placeholder="例如：发生了什么、在哪里遇到，或你希望增加的玩法……" aria-describedby="public-note count" required></textarea><div class="count" id="count">0 / 240 字</div><button class="send" id="send" disabled>发布留言</button></form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="small public" id="public-note">这是公开留言板，所有玩家都可以看见。请勿留下密码、手机号等个人信息。</p>
    </section>
    <section class="panel" aria-labelledby="messages-title"><div class="list-head"><h2 id="messages-title">玩家留言</h2><button class="refresh" id="refresh" type="button">刷新</button></div><div id="messages" aria-live="polite"><p class="empty">正在加载留言……</p></div><button id="older" class="older" type="button" hidden>查看更早的留言</button></section>
  </div>
  <footer>每次留言间隔 60 秒 · 每账号 10 分钟最多 3 条、每天最多 10 条 · 重复内容不会重复发布<br>留言自动备份至异地服务器<br><a href="https://qm.qq.com/q/E0OG9CLIg" target="_blank" rel="noopener noreferrer">加入 QQ 交流群 · 227990150</a></footer>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const input = $('message'), status = $('status'), send = $('send');
  let user = '', pending = false, next = 0, busy = false, timer;
  const date = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', dateStyle:'short', timeStyle:'short' });
  try { input.value = localStorage.getItem('ashflor-feedback-draft') || ''; } catch (_) {}
  function update() { const n = [...input.value].length; $('count').textContent = n + ' / 240 字'; send.disabled = !user || pending || !input.value.trim() || n > 240; }
  function notify(text, error=false) { status.textContent = text; status.classList.toggle('error', error); }
  function render(entries, append) {
    if (!append) $('messages').replaceChildren();
    if (!entries.length && !append) { const p=document.createElement('p');p.className='empty';p.textContent='还没有留言。来留下第一条吧。';$('messages').append(p); }
    for (const e of entries) {
      const item=document.createElement('article');item.className='message';
      const meta=document.createElement('div');meta.className='meta';
      const author=document.createElement('span');author.className='author';author.textContent=e.author;
      const time=document.createElement('time');time.dateTime=new Date(e.timestamp).toISOString();time.textContent=date.format(e.timestamp);
      const text=document.createElement('p');text.textContent=e.text;
      meta.append(author,time);item.append(meta,text);$('messages').append(item);
    }
  }
  async function load(append=false) {
    if(busy)return;busy=true;$('refresh').disabled=$('older').disabled=true;
    try {
      const r=await fetch('/api/feedback'+(append?'?before='+next:''),{cache:'no-store'});
      if(!r.ok)throw Error();const data=await r.json();if(!data.ok)throw Error();
      render(data.entries,append);next=data.next_before;$('older').hidden=!next;
    } catch (_) { notify('留言暂时加载失败，请点击刷新重试。',true); }
    finally {busy=false;$('refresh').disabled=$('older').disabled=false;}
  }
  window.addEventListener('message', event => {
    if(event.origin!==location.origin || event.source!==window.opener || !event.data)return;
    const d=event.data;
    if(d.kind==='ashflor-feedback-session') {
      user=typeof d.user==='string'?d.user:'';
      $('identity').replaceChildren();
      if(user){$('identity').append('以 ');const strong=document.createElement('strong');strong.textContent=user;$('identity').append(strong,' 的身份留言');}
      else $('identity').textContent='请在游戏中登录，再从“给作者留言”进入';
      update();
    } else if(d.kind==='ashflor-feedback-result' && pending) {
      clearTimeout(timer);pending=false;input.disabled=false;
      if(d.result===0){input.value='';try{localStorage.removeItem('ashflor-feedback-draft');}catch(_){}notify('留言已发布，谢谢你的反馈。');load();}
      else notify(({1:'请先在游戏中登录，再打开留言板。',2:'请输入 1～240 字的留言。',3:'留言太快了，请等待 60 秒后再试。',4:'暂时无法保存，请稍后重试。',5:'这条内容近期已经发布过，请勿重复留言。',6:'账号或当前网络的留言次数已达限额，请稍后再试。',7:'留言板暂时繁忙，请稍后再试。'})[d.result]||'留言未发布，请稍后重试。',true);
      update();
    }
  });
  input.addEventListener('input',()=>{try{localStorage.setItem('ashflor-feedback-draft',input.value);}catch(_){}update();});
  $('form').addEventListener('submit',event=>{
    event.preventDefault();if(send.disabled)return;
    if(!window.opener||window.opener.closed){notify('游戏窗口已关闭，请从游戏中重新打开留言板。',true);return;}
    pending=true;input.disabled=true;update();notify('正在发布……');
    window.opener.postMessage({kind:'ashflor-feedback-post',text:input.value.trim()},location.origin);
    timer=setTimeout(()=>{pending=false;input.disabled=false;update();notify('暂未收到发布结果，请先刷新留言列表确认。草稿已保留。',true);},15000);
  });
  $('back').onclick=()=>{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();}else location.href='/';};
  $('refresh').onclick=()=>load();$('older').onclick=()=>load(true);
  if(window.opener)window.opener.postMessage({kind:'ashflor-feedback-ready'},location.origin);
  update();load();
})();
</script>
</html>
