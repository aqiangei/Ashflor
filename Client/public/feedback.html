<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>给作者留言 · Ashflor</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#344734;background:#f6f3df;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#e1edc5,transparent 65%);min-height:100vh}main{max-width:1020px;margin:auto;padding:28px 24px 56px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:30px}.brand{font-weight:800;letter-spacing:.1em;color:#496a3e}a{color:#376d4b}button,.button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:650;background:#e6e9d4;color:#344734;text-decoration:none}button:hover,.button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #84ad57;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.intro{margin:12px 0 26px}.eyebrow{font-size:13px;color:#54754a;font-weight:700;letter-spacing:.1em}h1{font-size:clamp(30px,5vw,42px);margin:8px 0 12px;letter-spacing:-.03em}.intro p{line-height:1.8;color:#61705a;margin:0}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}.panel{border:1px solid #d9dfc4;background:#fffcf0;border-radius:20px;box-shadow:0 5px 0 #dce3c2;padding:24px}.composer{position:sticky;top:20px}h2{font-size:19px;margin:0 0 16px}.small{font-size:13px;line-height:1.7;color:#65735e}.identity{font-size:14px;margin-bottom:16px}.identity strong{color:#386743}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}textarea{width:100%;resize:vertical;min-height:175px;border:1px solid #c9d4b5;border-radius:12px;padding:13px;font:inherit;font-size:15px;line-height:1.7;background:#fffef7;color:#344734}textarea::placeholder{color:#909983}.count{text-align:right;font-size:12px;color:#7c8970;margin:6px 0 16px}.send{width:100%;background:#547d46;color:white;box-shadow:0 3px 0 #365d2c}.status{min-height:24px;font-size:14px;line-height:1.6;margin:14px 0 0;overflow-wrap:anywhere}.status.error{color:#a24f37}.public{border-top:1px solid #e2e6d2;padding-top:16px;margin-top:18px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}.list-head h2{margin:0}.list-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.refresh,.mod-btn{font-size:13px;padding:8px 12px}.mod-btn.on{background:#547d46;color:#fff}.message{border-bottom:1px solid #e1e6d1;padding:19px 0}.message:first-child{padding-top:8px}.message:last-child{border-bottom:0;padding-bottom:6px}.message.handled{opacity:.72}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:12px;color:#7d886f;align-items:center}.author{font-size:14px;font-weight:750;color:#42603b}.message p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.8;margin:10px 0 0}.row-actions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.toggle{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid #c5d0ad;background:#f3f6e8;color:#4a5d42}.toggle.done{background:#dcecc8;border-color:#8fb56a;color:#2f5a28}.toggle:disabled{opacity:.55;cursor:not-allowed}.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#efe8d4;color:#6a7358}.badge.done{background:#d7e8c0;color:#356338}.badge.fix{background:#d4e4ef;color:#2f5570}.badge.fix.done{background:#c5ddef;color:#1e4a66}.toggle.fix{border-color:#a8c4d8;background:#eaf3f8;color:#2f5570}.toggle.fix.done{background:#cfe3f1;border-color:#6fa0c0;color:#1a4560}.message.resolved{box-shadow:inset 3px 0 0 #6fa0c0}.empty{padding:36px 10px;text-align:center;color:#7b886d;line-height:1.8}.older{display:block;margin:20px auto 0}.older[hidden]{display:none}dialog#auth-dialog{border:1px solid #d9dfc4;border-radius:16px;padding:22px 24px;background:#fffcf0;color:#344734;width:min(340px,calc(100vw - 32px));box-shadow:0 12px 40px #0003}dialog#auth-dialog::backdrop{background:rgba(30,40,28,.35)}dialog#auth-dialog h3{margin:0 0 8px;font-size:17px}dialog#auth-dialog p{margin:0 0 14px;font-size:13px;color:#65735e;line-height:1.6}dialog#auth-dialog input{width:100%;border:1px solid #c9d4b5;border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:14px;background:#fffef7}dialog#auth-dialog .dlg-actions{display:flex;gap:8px;justify-content:flex-end}footer{margin-top:30px;font-size:12px;color:#7d886f;text-align:center;line-height:1.8}footer a{margin:0 6px}@media(max-width:700px){main{padding:20px 16px 36px}header{padding-bottom:18px}.layout{grid-template-columns:1fr;gap:20px}.composer{position:static}.panel{padding:20px}.intro{margin-top:8px}textarea{min-height:130px}.intro p{font-size:14px}}
</style>
<main>
  <header><span class="brand">ASHFLOR · 灰烬</span><button type="button" id="back">返回游戏 ↗</button></header>
  <section class="intro"><span class="eyebrow">一起让花园变得更好</span><h1>给作者留言</h1><p>遇到的问题、游玩的建议，或者想说的话，都可以留在这里。</p></section>
  <div class="layout">
    <section class="panel composer" aria-labelledby="compose-title">
      <h2 id="compose-title">写一条留言</h2>
      <div class="identity" id="identity">从游戏中登录后即可留言</div>
      <form id="form"><label for="message">留言内容</label><textarea id="message" placeholder="例如：发生了什么、在哪里遇到，或你希望增加的玩法……" aria-describedby="public-note count" required></textarea><div class="count" id="count">0 / 240 字</div><button class="send" id="send" disabled>发布留言</button></form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="small public" id="public-note">这是公开留言板，所有玩家都可以看见。请勿留下密码、手机号等个人信息。</p>
    </section>
    <section class="panel" aria-labelledby="messages-title">
      <div class="list-head">
        <h2 id="messages-title">玩家留言</h2>
        <div class="list-actions">
          <button class="mod-btn" id="modAuth" type="button">权限验证</button>
          <button class="refresh" id="refresh" type="button">刷新</button>
        </div>
      </div>
      <div id="messages" aria-live="polite"><p class="empty">正在加载留言……</p></div>
      <button id="older" class="older" type="button" hidden>查看更早的留言</button>
    </section>
  </div>
  <footer>每次留言间隔 60 秒 · 每账号 10 分钟最多 3 条、每天最多 10 条 · 重复内容不会重复发布<br>留言自动备份至异地服务器<br><a href="https://qm.qq.com/q/E0OG9CLIg" target="_blank" rel="noopener noreferrer">加入 QQ 交流群 · 227990150</a></footer>
</main>
<dialog id="auth-dialog">
  <h3>管理员验证</h3>
  <p>输入密钥后可切换留言的处理状态。密钥仅保存在本机会话中。</p>
  <form method="dialog" id="auth-form">
    <input type="password" id="auth-key" autocomplete="current-password" placeholder="密钥" required>
    <div class="dlg-actions">
      <button type="button" id="auth-cancel" value="cancel">取消</button>
      <button type="submit" id="auth-ok" value="ok" class="send" style="width:auto;box-shadow:none">确认</button>
    </div>
  </form>
</dialog>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const input = $('message'), status = $('status'), send = $('send');
  const authDlg = $('auth-dialog'), authKey = $('auth-key');
  let user = '', pending = false, resolvePending = null, next = 0, busy = false, timer, resolveTimer, modKey = '';
  try { modKey = sessionStorage.getItem('ashflor-feedback-mod') || ''; } catch (_) {}
  const date = new Intl.DateTimeFormat('zh-CN', { timeZone:'Asia/Shanghai', dateStyle:'short', timeStyle:'short' });
  try { input.value = localStorage.getItem('ashflor-feedback-draft') || ''; } catch (_) {}
  const sameUser = (a, b) => (a || '').toLowerCase() === (b || '').toLowerCase();

  function update() {
    const n = [...input.value].length;
    $('count').textContent = n + ' / 240 字';
    send.disabled = !user || pending || !input.value.trim() || n > 240;
  }
  function notify(text, error=false) {
    status.textContent = text;
    status.classList.toggle('error', error);
  }
  function syncAuthUi() {
    const on = !!modKey;
    $('modAuth').classList.toggle('on', on);
    $('modAuth').textContent = on ? '已验证 · 退出' : '权限验证';
    document.querySelectorAll('.toggle-handled').forEach(btn => { btn.disabled = !on; });
  }
  function setHandledUi(item, handled) {
    item.classList.toggle('handled', !!handled);
    const badge = item.querySelector('.badge-handled');
    const btn = item.querySelector('.toggle-handled');
    if (badge) {
      badge.classList.toggle('done', !!handled);
      badge.textContent = handled ? '开发：已处理' : '开发：未处理';
    }
    if (btn) {
      btn.classList.toggle('done', !!handled);
      btn.textContent = handled ? '标为未处理' : '标为已处理';
      btn.dataset.handled = handled ? '1' : '0';
    }
  }
  function setResolvedUi(item, resolved) {
    item.classList.toggle('resolved', !!resolved);
    const badge = item.querySelector('.badge-resolved');
    const btn = item.querySelector('.toggle-resolved');
    if (badge) {
      badge.classList.toggle('done', !!resolved);
      badge.textContent = resolved ? '提问者：已解决' : '提问者：未解决';
    }
    if (btn) {
      btn.classList.toggle('done', !!resolved);
      btn.textContent = resolved ? '标为未解决' : '标为已解决';
      btn.dataset.resolved = resolved ? '1' : '0';
    }
  }
  async function toggleHandled(item, id, nextHandled) {
    if (!modKey) {
      authDlg.showModal();
      authKey.focus();
      return;
    }
    const btn = item.querySelector('.toggle-handled');
    if (btn) btn.disabled = true;
    try {
      const r = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'set_handled', id, handled: nextHandled ? 1 : 0, key: modKey })
      });
      const data = await r.json();
      if (!data.ok) {
        if ((data.msg || '').includes('密钥')) {
          modKey = '';
          try { sessionStorage.removeItem('ashflor-feedback-mod'); } catch (_) {}
          syncAuthUi();
          notify(data.msg || '密钥错误', true);
          authDlg.showModal();
          return;
        }
        notify(data.msg || '更新失败', true);
        return;
      }
      setHandledUi(item, data.handled ? 1 : 0);
    } catch (_) {
      notify('更新处理状态失败，请稍后重试。', true);
    } finally {
      syncAuthUi();
    }
  }
  function toggleResolved(item, id, nextResolved) {
    if (!user) {
      notify('请先在游戏中登录，再从「给作者留言」打开本页。', true);
      return;
    }
    if (!window.opener || window.opener.closed) {
      notify('游戏窗口已关闭，请从游戏中重新打开留言板后再切换。', true);
      return;
    }
    if (resolvePending) return;
    const btn = item.querySelector('.toggle-resolved');
    if (btn) btn.disabled = true;
    resolvePending = id;
    notify('正在更新解决状态……');
    window.opener.postMessage({
      kind: 'ashflor-feedback-resolve',
      id,
      resolved: nextResolved ? 1 : 0
    }, location.origin);
    clearTimeout(resolveTimer);
    resolveTimer = setTimeout(() => {
      if (resolvePending !== id) return;
      resolvePending = null;
      if (btn) btn.disabled = false;
      notify('暂未收到更新结果，请刷新后确认。', true);
    }, 12000);
  }
  function render(entries, append) {
    if (!append) $('messages').replaceChildren();
    if (!entries.length && !append) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '还没有留言。来留下第一条吧。';
      $('messages').append(p);
    }
    for (const e of entries) {
      const handled = !!(e.handled | 0);
      const resolved = !!(e.resolved | 0);
      const mine = !!user && sameUser(user, e.author);
      const item = document.createElement('article');
      item.className = 'message'
        + (handled ? ' handled' : '')
        + (resolved ? ' resolved' : '');
      item.dataset.id = String(e.id);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const author = document.createElement('span');
      author.className = 'author';
      author.textContent = e.author;
      const time = document.createElement('time');
      time.dateTime = new Date(e.timestamp).toISOString();
      time.textContent = date.format(e.timestamp);
      const text = document.createElement('p');
      text.textContent = e.text;
      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const badgeR = document.createElement('span');
      badgeR.className = 'badge badge-resolved fix' + (resolved ? ' done' : '');
      badgeR.textContent = resolved ? '提问者：已解决' : '提问者：未解决';
      actions.append(badgeR);
      if (mine) {
        const btnR = document.createElement('button');
        btnR.type = 'button';
        btnR.className = 'toggle toggle-resolved fix' + (resolved ? ' done' : '');
        btnR.dataset.resolved = resolved ? '1' : '0';
        btnR.textContent = resolved ? '标为未解决' : '标为已解决';
        btnR.addEventListener('click', () => {
          const cur = btnR.dataset.resolved === '1';
          toggleResolved(item, e.id, !cur);
        });
        actions.append(btnR);
      }

      const badgeH = document.createElement('span');
      badgeH.className = 'badge badge-handled' + (handled ? ' done' : '');
      badgeH.textContent = handled ? '开发：已处理' : '开发：未处理';
      const btnH = document.createElement('button');
      btnH.type = 'button';
      btnH.className = 'toggle toggle-handled' + (handled ? ' done' : '');
      btnH.dataset.handled = handled ? '1' : '0';
      btnH.disabled = !modKey;
      btnH.textContent = handled ? '标为未处理' : '标为已处理';
      btnH.addEventListener('click', () => {
        const cur = btnH.dataset.handled === '1';
        toggleHandled(item, e.id, !cur);
      });
      actions.append(badgeH, btnH);

      meta.append(author, time);
      item.append(meta, text, actions);
      $('messages').append(item);
    }
    syncAuthUi();
  }
  async function load(append=false) {
    if (busy) return;
    busy = true;
    $('refresh').disabled = $('older').disabled = true;
    try {
      const r = await fetch('/api/feedback' + (append ? '?before=' + next : ''), { cache: 'no-store' });
      if (!r.ok) throw Error();
      const data = await r.json();
      if (!data.ok) throw Error();
      render(data.entries, append);
      next = data.next_before;
      $('older').hidden = !next;
    } catch (_) {
      notify('留言暂时加载失败，请点击刷新重试。', true);
    } finally {
      busy = false;
      $('refresh').disabled = $('older').disabled = false;
    }
  }
  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== window.opener || !event.data) return;
    const d = event.data;
    if (d.kind === 'ashflor-feedback-session') {
      user = typeof d.user === 'string' ? d.user : '';
      $('identity').replaceChildren();
      if (user) {
        $('identity').append('以 ');
        const strong = document.createElement('strong');
        strong.textContent = user;
        $('identity').append(strong, ' 的身份留言');
      } else {
        $('identity').textContent = '请在游戏中登录，再从“给作者留言”进入';
      }
      update();
      // Re-paint so owner resolve buttons appear after session arrives.
      if ($('messages').querySelector('.message')) load();
    } else if (d.kind === 'ashflor-feedback-result' && pending) {
      clearTimeout(timer);
      pending = false;
      input.disabled = false;
      if (d.result === 0) {
        input.value = '';
        try { localStorage.removeItem('ashflor-feedback-draft'); } catch (_) {}
        notify('留言已发布，谢谢你的反馈。');
        load();
      } else {
        notify(({
          1: '请先在游戏中登录，再打开留言板。',
          2: '请输入 1～240 字的留言。',
          3: '留言太快了，请等待 60 秒后再试。',
          4: '暂时无法保存，请稍后重试。',
          5: '这条内容近期已经发布过，请勿重复留言。',
          6: '账号或当前网络的留言次数已达限额，请稍后再试。',
          7: '留言板暂时繁忙，请稍后再试。'
        })[d.result] || '留言未发布，请稍后重试。', true);
      }
      update();
    } else if (d.kind === 'ashflor-feedback-resolved') {
      clearTimeout(resolveTimer);
      const id = d.id | 0;
      const item = $('messages').querySelector('.message[data-id="' + id + '"]');
      const btn = item && item.querySelector('.toggle-resolved');
      resolvePending = null;
      if (btn) btn.disabled = false;
      if (d.result === 0) {
        if (item) setResolvedUi(item, d.resolved ? 1 : 0);
        notify(d.resolved ? '已标记为已解决。' : '已标记为未解决。');
      } else {
        notify(({
          1: '请先在游戏中登录。',
          2: '无效的留言。',
          4: '暂时无法保存，请稍后重试。',
          8: '只能修改自己的留言。',
          9: '留言不存在或已过期。'
        })[d.result] || '更新解决状态失败。', true);
      }
    }
  });
  input.addEventListener('input', () => {
    try { localStorage.setItem('ashflor-feedback-draft', input.value); } catch (_) {}
    update();
  });
  $('form').addEventListener('submit', event => {
    event.preventDefault();
    if (send.disabled) return;
    if (!window.opener || window.opener.closed) {
      notify('游戏窗口已关闭，请从游戏中重新打开留言板。', true);
      return;
    }
    pending = true;
    input.disabled = true;
    update();
    notify('正在发布……');
    window.opener.postMessage({ kind: 'ashflor-feedback-post', text: input.value.trim() }, location.origin);
    timer = setTimeout(() => {
      pending = false;
      input.disabled = false;
      update();
      notify('暂未收到发布结果，请先刷新留言列表确认。草稿已保留。', true);
    }, 15000);
  });
  $('modAuth').onclick = () => {
    if (modKey) {
      modKey = '';
      try { sessionStorage.removeItem('ashflor-feedback-mod'); } catch (_) {}
      syncAuthUi();
      notify('已退出管理权限。');
      return;
    }
    authKey.value = '';
    authDlg.showModal();
    authKey.focus();
  };
  $('auth-cancel').onclick = () => authDlg.close();
  $('auth-form').addEventListener('submit', event => {
    event.preventDefault();
    const key = authKey.value.trim();
    if (!key) return;
    fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'auth', key })
    }).then(r => r.json()).then(data => {
      if (!data || !data.ok) {
        notify((data && data.msg) || '密钥错误', true);
        authKey.select();
        return;
      }
      modKey = key;
      try { sessionStorage.setItem('ashflor-feedback-mod', key); } catch (_) {}
      authDlg.close();
      syncAuthUi();
      notify('权限已验证，可切换留言处理状态。');
    }).catch(() => {
      notify('验证请求失败，请稍后重试。', true);
    });
  });
  $('back').onclick = () => {
    if (window.opener && !window.opener.closed) { window.opener.focus(); window.close(); }
    else {
      // Drop the browsing-context name so the game tab is not still
      // "ashflor-feedback" — otherwise the next open_feedback_board call
      // navigates this same tab instead of opening a new page.
      try { window.name = ''; } catch (_) {}
      location.href = '/';
    }
  };
  $('refresh').onclick = () => load();
  $('older').onclick = () => load(true);
  if (window.opener) window.opener.postMessage({ kind: 'ashflor-feedback-ready' }, location.origin);
  update();
  syncAuthUi();
  load();
})();
</script>
</html>
