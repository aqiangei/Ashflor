<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                overflow: hidden;
            }
            html, body {
                width: 100%;
                height: 100%;
                background: #0a0a0a;
                font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
                font-weight: 800;
                touch-action: none;
                overscroll-behavior: none;
            }
            /* Font probe only — must never show as a "loading page" */
            #font-loader {
                position: absolute;
                left: -9999px;
                top: -9999px;
                visibility: hidden;
                pointer-events: none;
                font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
                font-weight: 800;
            }
            #canvas {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                cursor: default;
                z-index: 1;
                /* Match in-game void so a cleared canvas never flashes pure black */
                background: #2a2624;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }
            /* DOM text fields live above the canvas */
            body > input[type="text"] {
                z-index: 5 !important;
                color: #111111 !important;
                caret-color: #111111 !important;
                -webkit-text-fill-color: #111111 !important;
                background: transparent !important;
                pointer-events: auto;
            }
            body input[type="text"].chat-input {
                color: #f6f1ff !important;
                caret-color: #d89aff !important;
                -webkit-text-fill-color: #f6f1ff !important;
            }
            /* Match title-screen void — soft garden dusk; hand off to in-game「连接中」 */
            #loading-bar {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(ellipse 80% 55% at 50% 35%, #3a4a32 0%, transparent 62%),
                    radial-gradient(ellipse 70% 50% at 70% 80%, #2c241c 0%, transparent 55%),
                    #1e1c1a;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                pointer-events: none; /* never block landscape / other overlays */
            }
            #loading-bar.hide {
                display: none;
                pointer-events: none;
            }
            #loading-brand {
                font-family: Ubuntu, "Noto Sans SC", sans-serif;
                font-size: clamp(44px, 8vw, 72px);
                font-weight: 700;
                color: #f2efe6;
                letter-spacing: 0.04em;
                text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
            }
            #loading {
                font-size: clamp(16px, 3.2vw, 22px);
                font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
                color: #b7c4a8;
                font-weight: 650;
                white-space: nowrap;
                min-height: 1.4em;
                max-width: min(92vw, 420px);
                text-align: center;
            }
            #loading.is-error {
                color: #ff8a80;
                font-size: clamp(16px, 3.2vw, 22px);
                white-space: normal;
                line-height: 1.35;
                padding: 0 12px;
                overflow: visible;
            }
            #loading .label {
                display: inline;
            }
            #loading .dots {
                display: inline-block;
                width: 1.5em;
                text-align: left;
            }
            #loading .dots span {
                display: inline-block;
                opacity: 0.2;
                animation: loading-dot 1.05s ease-in-out infinite;
            }
            #loading .dots span:nth-child(1) { animation-delay: 0s; }
            #loading .dots span:nth-child(2) { animation-delay: 0.18s; }
            #loading .dots span:nth-child(3) { animation-delay: 0.36s; }
            @keyframes loading-dot {
                0%, 80%, 100% { opacity: 0.2; }
                40% { opacity: 1; }
            }
            #loading-track {
                display: block;
                width: min(72vw, 280px);
                height: 8px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.12);
                overflow: hidden;
                box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
            }
            #loading-track.is-error {
                display: none;
            }
            #loading-fill {
                height: 100%;
                width: 0%;
                border-radius: inherit;
                background: linear-gradient(90deg, #6a8f4e, #a3c46a);
                transition: width 0.12s linear;
            }
            /* Outside #loading-bar so fast loads do not cut display time short */
            #landscape-btn {
                display: none;
                position: fixed;
                right: max(16px, env(safe-area-inset-right));
                bottom: max(16px, env(safe-area-inset-bottom));
                z-index: 200;
                border: 3px solid #ffffff;
                border-radius: 14px;
                background: #1dd129;
                color: #ffffff;
                font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
                font-size: 16px;
                font-weight: 700;
                padding: 16px 22px;
                min-width: 120px;
                min-height: 52px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.35);
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
                pointer-events: auto;
                cursor: pointer;
                transition: opacity 0.45s ease, transform 0.15s ease;
                opacity: 1;
            }
            #landscape-btn.hide {
                opacity: 0;
                pointer-events: none;
            }
            @keyframes landscape-blink {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.45; transform: scale(1.06); }
            }
            /* In-game update poster (DOM above canvas; does not pause server) */
            #update-poster-overlay {
                position: fixed;
                inset: 0;
                z-index: 40;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
                box-sizing: border-box;
                background: rgba(10, 12, 10, 0.62);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.24s ease, visibility 0.24s ease;
            }
            #update-poster-overlay.show {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }
            body.update-poster-open {
                touch-action: none;
            }
            .update-poster-panel {
                position: relative;
                width: min(92vw, 520px);
                max-height: min(88vh, 860px);
                border-radius: 18px;
                background: #1c241c;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                overflow: hidden;
                transform: scale(0.94);
                transition: transform 0.26s ease;
            }
            #update-poster-overlay.show .update-poster-panel {
                transform: scale(1);
            }
            .update-poster-scroll {
                max-height: min(88vh, 860px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            .update-poster-img {
                display: block;
                width: 100%;
                height: auto;
                vertical-align: top;
            }
            .update-poster-close {
                position: absolute;
                top: 8px;
                right: 10px;
                z-index: 2;
                width: 40px;
                height: 40px;
                border: none;
                border-radius: 12px;
                background: rgba(0, 0, 0, 0.45);
                color: #f4f1e8;
                font-size: 26px;
                font-weight: 700;
                line-height: 1;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            .update-poster-fallback {
                padding: 36px 28px 40px;
                color: #f3ecd8;
                font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            }
            .update-poster-brand {
                font-family: Ubuntu, "Noto Sans SC", sans-serif;
                font-size: 18px;
                letter-spacing: 0.08em;
                opacity: 0.85;
                margin-bottom: 10px;
            }
            .update-poster-title {
                font-family: Georgia, "Noto Serif SC", serif;
                font-size: clamp(28px, 6vw, 40px);
                font-weight: 700;
                margin-bottom: 8px;
            }
            .update-poster-sub {
                font-size: 16px;
                opacity: 0.85;
                margin-bottom: 22px;
            }
            .update-poster-list {
                margin: 0;
                padding-left: 1.2em;
                line-height: 1.7;
                font-size: 15px;
            }
            .update-poster-error {
                padding: 28px;
                text-align: center;
                color: #ffb4a8;
                font-size: 15px;
            }
            @media (prefers-reduced-motion: reduce) {
                #update-poster-overlay,
                .update-poster-panel {
                    transition: none;
                }
            }
            /* Disconnect / redeploy wait screen + mini petal game */
            #reconnect-overlay {
                position: fixed;
                inset: 0;
                z-index: 90;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 10px;
                padding: 28px 16px 16px;
                box-sizing: border-box;
                background:
                    radial-gradient(ellipse 75% 55% at 50% 30%, #1e3324 0%, #0c120e 55%, #050705 100%);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.35s ease, visibility 0.35s ease;
            }
            #reconnect-overlay.show {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }
            #reconnect-brand {
                font-family: Ubuntu, "Noto Sans SC", sans-serif;
                font-size: clamp(26px, 5.5vw, 44px);
                font-weight: 700;
                color: #f2f2f2;
                letter-spacing: 0.04em;
                animation: brand-breathe 2.2s ease-in-out infinite;
            }
            #reconnect-msg {
                font-size: clamp(14px, 3vw, 20px);
                font-weight: 700;
                color: #c8e6c9;
                text-align: center;
                min-height: 1.4em;
            }
            #reconnect-msg .dots span {
                display: inline-block;
                opacity: 0.25;
                animation: loading-dot 1.05s ease-in-out infinite;
            }
            #reconnect-msg .dots span:nth-child(1) { animation-delay: 0s; }
            #reconnect-msg .dots span:nth-child(2) { animation-delay: 0.18s; }
            #reconnect-msg .dots span:nth-child(3) { animation-delay: 0.36s; }
            #reconnect-hint {
                font-size: 13px;
                color: #9aaa9a;
                margin-top: 2px;
            }
            #reconnect-score {
                font-size: 15px;
                font-weight: 700;
                color: #ffe082;
            }
            #mini-game {
                width: min(420px, 92vw);
                height: min(340px, 48vh);
                border-radius: 16px;
                border: 2px solid rgba(255,255,255,0.18);
                background: linear-gradient(180deg, #2d6a4f 0%, #1b4332 55%, #081c15 100%);
                box-shadow: 0 8px 28px rgba(0,0,0,0.45);
                touch-action: none;
                cursor: pointer;
            }
        </style>
        <meta name="viewport" content="user-scalable=no, width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#2a2624">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
        <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
        <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
        <link rel="manifest" href="/site.webmanifest">
        <title>ashflor.io</title>
    </head>
    <body>
    <div id="loading-bar">
        <div id="loading-brand">ashflor.io</div>
        <div id="loading"><span class="label">加载中</span><span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
        <div id="loading-track" aria-hidden="true"><div id="loading-fill"></div></div>
    </div>
    <button id="landscape-btn" type="button">横屏游戏</button>
    <div id="reconnect-overlay" aria-hidden="true">
        <div id="reconnect-brand">ashflor.io</div>
        <div id="reconnect-msg">连接断开，正在重连<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
        <div id="reconnect-hint">点下落的花瓣玩一会 · 服务器更新后会自动回来</div>
        <div id="reconnect-score">得分 0</div>
        <canvas id="mini-game" width="420" height="340"></canvas>
    </div>
    <div id="font-loader" style="font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; font-weight: 800;">加载中 你好 hello!</div>
    <canvas id="canvas" width="0" height="0"></canvas>
    <script>
        (function () {
            // Stay until user taps or orientation is landscape (loading overlay must not steal taps).
            var LANDSCAPE_BTN_MS = 20000;
            var isMobile = /iPhone|iPad|iPod|Android|BlackBerry/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 1 && window.matchMedia("(pointer: coarse)").matches);
            var btn = document.getElementById("landscape-btn");
            if (!isMobile || !btn) return;

            var hidden = false;
            var armed = false;
            btn.style.display = "block";

            function hideBtn() {
                if (hidden) return;
                hidden = true;
                btn.classList.add("hide");
                setTimeout(function () {
                    btn.style.display = "none";
                }, 500);
            }

            function isLandscape() {
                try {
                    if (screen.orientation && typeof screen.orientation.type === "string")
                        return screen.orientation.type.indexOf("landscape") === 0;
                } catch (e) {}
                return window.innerWidth > window.innerHeight;
            }

            async function goLandscape(e) {
                if (e) {
                    try { e.preventDefault(); } catch (err) {}
                    try { e.stopPropagation(); } catch (err) {}
                }
                if (armed) return;
                armed = true;
                try {
                    var el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                } catch (err) {}
                try {
                    if (screen.orientation && screen.orientation.lock)
                        await screen.orientation.lock("landscape");
                } catch (err) {}
                hideBtn();
            }

            // pointerup covers mouse + touch; touchend as backup for older WebViews
            btn.addEventListener("pointerup", goLandscape, { passive: false });
            btn.addEventListener("click", goLandscape, { passive: false });
            btn.addEventListener("touchend", goLandscape, { passive: false });

            setTimeout(function () {
                if (isLandscape()) hideBtn();
                else setTimeout(hideBtn, LANDSCAPE_BTN_MS);
            }, 0);
            if (screen.orientation && screen.orientation.addEventListener) {
                screen.orientation.addEventListener("change", function () {
                    if (isLandscape()) hideBtn();
                });
            }
            window.addEventListener("resize", function () {
                if (isLandscape()) hideBtn();
            });
        })();

        document.addEventListener("DOMContentLoaded", () => {
            // deploy-update.ps1 bumps this digits-only string each release
            var cacheV = '21787';
            var hidden = false;
            var loadingEl = document.getElementById("loading");
            var trackEl = document.getElementById("loading-track");
            var fillEl = document.getElementById("loading-fill");
            var brandEl = document.getElementById("loading-brand");
            var loadProgress = 0;
            var softTimer = 0;
            var softFrom = 0;
            var softCap = 0;
            var softT0 = 0;
            var softMs = 0;

            function setLoadProgress(p) {
                loadProgress = Math.max(loadProgress, Math.min(1, p));
                if (fillEl) fillEl.style.width = (loadProgress * 100).toFixed(1) + "%";
            }

            function hardResetClient() {
                var done = function () {
                    try { location.href = location.pathname + "?v=" + cacheV + "&r=" + Date.now(); }
                    catch (e) { location.reload(); }
                };
                var tasks = [];
                if ("serviceWorker" in navigator) {
                    tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                        return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    }).catch(function () {}));
                }
                if (window.caches && caches.keys) {
                    tasks.push(caches.keys().then(function (keys) {
                        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    }).catch(function () {}));
                }
                Promise.all(tasks).then(done, done);
            }

            function setLoadingMessage(msg, withDots) {
                if (!loadingEl) return;
                loadingEl.classList.remove("is-error");
                loadingEl.style.cursor = "";
                loadingEl.onclick = null;
                if (trackEl) trackEl.classList.remove("is-error");
                if (withDots) {
                    loadingEl.innerHTML =
                        '<span class="label"></span>' +
                        '<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>';
                    loadingEl.querySelector(".label").textContent = msg;
                } else {
                    loadingEl.classList.add("is-error");
                    if (trackEl) trackEl.classList.add("is-error");
                    loadingEl.textContent = msg;
                    // Tap / click clears SW + Cache Storage then reloads — fixes
                    // post-deploy "stuck on 编译中" from half-cached wasm/js.
                    loadingEl.style.cursor = "pointer";
                    loadingEl.onclick = function () { hardResetClient(); };
                }
            }

            function hideLoading() {
                if (hidden) return;
                if (!window.Module || !window.Module.canvas) return;
                hidden = true;
                if (softTimer) { clearInterval(softTimer); softTimer = 0; }
                setLoadProgress(1);
                var bar = document.getElementById("loading-bar");
                if (bar) bar.classList.add("hide");
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js?v=' + cacheV).catch(function () {});
            }

            var Module = window.Module = window.Module || {};
            if (new URLSearchParams(location.search).has('perf')) Module['profileFrames'] = [];
            Module.locateFile = function (path) {
                return path + '?v=' + cacheV;
            };
            // Own the wasm fetch: real download progress, magic-byte check, timeout,
            // and a clear recovery path. Avoids silent hang on 编译中 after deploys
            // (SW/CDN half-cache, mid-restart 404, broken gzip streaming).
            Module.instantiateWasm = function (imports, successCallback) {
                var url = Module.locateFile("gardn-client.wasm", "");
                var aborted = false;
                var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
                var timer = setTimeout(function () {
                    aborted = true;
                    try { ctrl && ctrl.abort(); } catch (e) {}
                    setLoadingMessage("编译超时：网络不稳或缓存损坏，点这里清除缓存重试", false);
                }, 45000);
                setLoadingMessage("下载引擎", true);
                startSoftProgress(0.72, 4500);
                fetch(url, {
                    credentials: "same-origin",
                    cache: "no-cache",
                    signal: ctrl ? ctrl.signal : undefined
                }).then(function (res) {
                    if (!res.ok) throw new Error("引擎下载失败 HTTP " + res.status);
                    if (!res.body || !res.body.getReader) return res.arrayBuffer();
                    var reader = res.body.getReader();
                    var chunks = [];
                    var received = 0;
                    var total = parseInt(res.headers.get("Content-Length") || "0", 10) || 0;
                    function pump() {
                        return reader.read().then(function (r) {
                            if (r.done) {
                                var out = new Uint8Array(received);
                                var off = 0;
                                for (var i = 0; i < chunks.length; i++) {
                                    out.set(chunks[i], off);
                                    off += chunks[i].length;
                                }
                                return out.buffer;
                            }
                            chunks.push(r.value);
                            received += r.value.length;
                            if (!hidden && total > 0)
                                setLoadProgress(0.5 + 0.22 * Math.min(1, received / total));
                            else if (!hidden)
                                setLoadProgress(Math.min(0.7, 0.5 + received / 4000000));
                            return pump();
                        });
                    }
                    return pump();
                }).then(function (buf) {
                    if (aborted) return;
                    var u8 = new Uint8Array(buf);
                    if (u8.length < 8 || u8[0] !== 0 || u8[1] !== 0x61 || u8[2] !== 0x73 || u8[3] !== 0x6d)
                        throw new Error("引擎文件损坏");
                    setLoadProgress(Math.max(loadProgress, 0.74));
                    setLoadingMessage("编译中", true);
                    // Long even slide — wasm compile often 3–15s with no real % callbacks.
                    startSoftProgress(0.94, 11000);
                    return WebAssembly.instantiate(buf, imports);
                }).then(function (pair) {
                    if (aborted || !pair) return;
                    clearTimeout(timer);
                    successCallback(pair.instance, pair.module);
                }).catch(function (err) {
                    clearTimeout(timer);
                    if (hidden) return;
                    var reason = String((err && err.message) || err || "未知错误").replace(/\s+/g, " ").trim();
                    if (/abort/i.test(reason)) reason = "下载超时";
                    setLoadingMessage("加载失败：" + reason.slice(0, 80) + "（点这里清除缓存重试）", false);
                });
                return {};
            };

            /* ---- reconnect overlay + petal catch mini-game ---- */
            (function () {
                var overlay = document.getElementById("reconnect-overlay");
                var msgEl = document.getElementById("reconnect-msg");
                var scoreEl = document.getElementById("reconnect-score");
                var canvas = document.getElementById("mini-game");
                if (!overlay || !canvas) return;
                var ctx = canvas.getContext("2d");
                var running = false;
                var raf = 0;
                var petals = [];
                var score = 0;
                var lastT = 0;
                var spawnAcc = 0;
                var colors = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#ff85a1", "#c77dff"];

                function resizeMini() {
                    var cssW = canvas.clientWidth || 420;
                    var cssH = canvas.clientHeight || 340;
                    var dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = Math.round(cssW * dpr);
                    canvas.height = Math.round(cssH * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    canvas._w = cssW;
                    canvas._h = cssH;
                }

                function spawnPetal() {
                    var w = canvas._w || 420;
                    petals.push({
                        x: 24 + Math.random() * (w - 48),
                        y: -20,
                        r: 14 + Math.random() * 10,
                        vy: 70 + Math.random() * 90,
                        vx: (Math.random() - 0.5) * 40,
                        rot: Math.random() * Math.PI * 2,
                        vr: (Math.random() - 0.5) * 3,
                        color: colors[(Math.random() * colors.length) | 0],
                        pop: 0
                    });
                }

                function drawPetal(p) {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    var s = p.pop > 0 ? 1 + p.pop * 0.8 : 1;
                    ctx.scale(s, s);
                    ctx.globalAlpha = p.pop > 0 ? Math.max(0, 1 - p.pop) : 1;
                    for (var i = 0; i < 5; i++) {
                        ctx.rotate((Math.PI * 2) / 5);
                        ctx.beginPath();
                        ctx.ellipse(0, -p.r * 0.55, p.r * 0.38, p.r * 0.62, 0, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    }
                    ctx.beginPath();
                    ctx.arc(0, 0, p.r * 0.28, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffe566";
                    ctx.fill();
                    ctx.restore();
                }

                function drawFlowerBase() {
                    var w = canvas._w || 420;
                    var h = canvas._h || 340;
                    ctx.save();
                    ctx.translate(w * 0.5, h - 36);
                    ctx.beginPath();
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffe763";
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-7, -3, 3.2, 0, Math.PI * 2);
                    ctx.arc(7, -3, 3.2, 0, Math.PI * 2);
                    ctx.fillStyle = "#333";
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 5, 8, 0.15, Math.PI - 0.15);
                    ctx.strokeStyle = "#333";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }

                function frame(t) {
                    if (!running) return;
                    var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
                    lastT = t;
                    var w = canvas._w || 420;
                    var h = canvas._h || 340;
                    spawnAcc += dt;
                    while (spawnAcc > 0.45) {
                        spawnAcc -= 0.45;
                        spawnPetal();
                    }
                    ctx.clearRect(0, 0, w, h);
                    // soft vignette grid
                    ctx.strokeStyle = "rgba(255,255,255,0.04)";
                    ctx.lineWidth = 1;
                    for (var gx = 0; gx < w; gx += 40) {
                        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
                    }
                    for (var gy = 0; gy < h; gy += 40) {
                        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
                    }
                    drawFlowerBase();
                    for (var i = petals.length - 1; i >= 0; i--) {
                        var p = petals[i];
                        if (p.pop > 0) {
                            p.pop += dt * 4;
                            drawPetal(p);
                            if (p.pop >= 1) petals.splice(i, 1);
                            continue;
                        }
                        p.y += p.vy * dt;
                        p.x += p.vx * dt + Math.sin(t / 400 + p.x) * 12 * dt;
                        p.rot += p.vr * dt;
                        drawPetal(p);
                        if (p.y > h + 40) petals.splice(i, 1);
                    }
                    raf = requestAnimationFrame(frame);
                }

                function hit(clientX, clientY) {
                    var rect = canvas.getBoundingClientRect();
                    var x = (clientX - rect.left) * ((canvas._w || rect.width) / rect.width);
                    var y = (clientY - rect.top) * ((canvas._h || rect.height) / rect.height);
                    for (var i = petals.length - 1; i >= 0; i--) {
                        var p = petals[i];
                        if (p.pop > 0) continue;
                        var dx = p.x - x, dy = p.y - y;
                        if (dx * dx + dy * dy <= (p.r + 12) * (p.r + 12)) {
                            p.pop = 0.01;
                            score += 1;
                            if (scoreEl) scoreEl.textContent = "得分 " + score;
                            return;
                        }
                    }
                }

                canvas.addEventListener("pointerdown", function (e) {
                    e.preventDefault();
                    hit(e.clientX, e.clientY);
                });

                function startGame() {
                    resizeMini();
                    petals = [];
                    score = 0;
                    spawnAcc = 0;
                    lastT = performance.now();
                    if (scoreEl) scoreEl.textContent = "得分 0";
                    if (!running) {
                        running = true;
                        raf = requestAnimationFrame(frame);
                    }
                }

                function stopGame() {
                    running = false;
                    if (raf) cancelAnimationFrame(raf);
                    raf = 0;
                    petals = [];
                }

                // Pending wait text if disconnect arrives before first paint
                var pendingWaitMsg = null;
                var waitDelayTimer = 0;
                var everOnline = false; // after first good packet: redeploy/stop must show wait UI
                // Short blips (tab switch) stay quiet; deploy kill is usually 1006 and <2s
                var WAIT_DELAY_MS = 500;
                var WAIT_DELAY_FIRST_MS = 1800; // never connected yet (first-load fail)

                Module.showReconnectOverlay = function (msg) {
                    var text = msg || "连接断开，正在重连";
                    // Still loading assets: keep original loader, never mini-game
                    if (!hidden) {
                        pendingWaitMsg = text;
                        setLoadingMessage(
                            text.indexOf("Ctrl+F5") >= 0 ? text : "服务器暂不可用，正在重试",
                            text.indexOf("Ctrl+F5") < 0
                        );
                        return;
                    }
                    pendingWaitMsg = null;
                    // Instant: outdated tip, redeploy/stop copy, or already showing
                    var immediate = text.indexOf("Ctrl+F5") >= 0 || text.indexOf("强制刷新") >= 0
                        || text.indexOf("停服") >= 0 || text.indexOf("更新") >= 0
                        || everOnline;
                    if (waitDelayTimer) {
                        clearTimeout(waitDelayTimer);
                        waitDelayTimer = 0;
                    }
                    function reveal() {
                        waitDelayTimer = 0;
                        var showDots = text.indexOf("Ctrl+F5") < 0 && text.indexOf("强制刷新") < 0;
                        if (msgEl) {
                            msgEl.innerHTML = showDots
                                ? (text + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>')
                                : text;
                        }
                        overlay.classList.add("show");
                        overlay.setAttribute("aria-hidden", "false");
                        startGame();
                    }
                    if (immediate || overlay.classList.contains("show")) {
                        reveal();
                    } else {
                        waitDelayTimer = setTimeout(reveal, everOnline ? WAIT_DELAY_MS : WAIT_DELAY_FIRST_MS);
                    }
                };
                Module.hideReconnectOverlay = function () {
                    everOnline = true;
                    pendingWaitMsg = null;
                    if (waitDelayTimer) {
                        clearTimeout(waitDelayTimer);
                        waitDelayTimer = 0;
                    }
                    overlay.classList.remove("show");
                    overlay.setAttribute("aria-hidden", "true");
                    stopGame();
                };
                // After first paint: if we were waiting on a dead server during load, promote
                Module._ashflorPromoteWaitOverlay = function () {
                    if (pendingWaitMsg) {
                        var m = pendingWaitMsg;
                        pendingWaitMsg = null;
                        Module.showReconnectOverlay(m);
                    }
                };
                window.addEventListener("resize", function () {
                    if (running) resizeMini();
                });
            })();

            Module['onFirstFrame'] = function () {
                hideLoading();
                if (Module._ashflorPromoteWaitOverlay) Module._ashflorPromoteWaitOverlay();
                console.info('Ashflor first frame: ' + Math.round(performance.now()) + ' ms after navigation');
            };
            Module.onRuntimeInitialized = function () {
                setLoadProgress(Math.max(loadProgress, 0.88));
                setLoadingMessage("连接中", true);
                startSoftProgress(0.98, 2800);
            };
            Module.onAbort = function (what) {
                var reason = String(what == null ? "" : what).replace(/\s+/g, " ").trim();
                if (!reason || reason === "undefined")
                    reason = "内存不足或客户端异常，请强刷重试";
                setLoadingMessage("加载失败：" + reason.slice(0, 120), false);
            };
            Module.printErr = function (text) {
                try {
                    console.error(text);
                    var s = String(text || "");
                    if (/Aborted\(/i.test(s) && !hidden) {
                        var m = s.match(/Aborted\((.*)\)/);
                        var detail = (m && m[1] && m[1] !== "undefined") ? m[1] : "内存不足或客户端异常";
                        setLoadingMessage("加载失败：" + detail.slice(0, 120), false);
                    }
                } catch (e) {}
            };
            // Emscripten may call setStatus during wasm compile / file fetch.
            Module.setStatus = function (text) {
                if (hidden || !text) return;
                var m = String(text).match(/([0-9]+)\s*%/);
                if (m) setLoadProgress(0.45 + 0.4 * (parseInt(m[1], 10) / 100));
            };

            setLoadingMessage("加载中", true);
            setLoadProgress(0.02);

            setTimeout(function () {
                if (!hidden) {
                    setLoadingMessage("连接超时：客户端下载过慢，请切换网络后刷新", false);
                }
            }, 120000);

            // Stage-timed fake bar: even slide for expectedMs, then slow forever-creep
            // so long "编译中" never looks frozen (old asymptotic crawl stalled near cap).
            function startSoftProgress(cap, expectedMs) {
                softCap = cap == null ? 0.97 : cap;
                softMs = expectedMs == null ? 5000 : expectedMs;
                softFrom = loadProgress;
                softT0 = performance.now();
                if (softFrom >= softCap - 0.001) return;
                if (softTimer) clearInterval(softTimer);
                softTimer = setInterval(function () {
                    if (hidden) { clearInterval(softTimer); softTimer = 0; return; }
                    var span = Math.max(0.001, softCap - softFrom);
                    var elapsed = performance.now() - softT0;
                    var target;
                    if (elapsed <= softMs) {
                        target = softFrom + span * 0.78 * (elapsed / softMs);
                    } else {
                        var overSec = (elapsed - softMs) / 1000;
                        // ~12s half-life on the remaining 22% — keeps ticking for 20–40s compiles
                        var reached = 0.78 + 0.219 * (1 - Math.exp(-overSec / 12));
                        target = softFrom + span * reached;
                    }
                    // If real download jumped ahead, rebase so soft keeps moving from new floor
                    if (loadProgress > target + 0.01) {
                        softFrom = loadProgress;
                        softT0 = performance.now();
                        softMs = Math.max(1800, softMs * 0.55);
                        return;
                    }
                    setLoadProgress(Math.min(softCap - 0.002, target));
                }, 50);
            }

            function loadClientScript(attempt) {
                var url = "gardn-client.js?v=" + cacheV + (attempt ? "&r=" + attempt : "");
                setLoadingMessage(attempt ? ("下载失败，正在重试 (" + (attempt + 1) + "/3)") : "下载客户端", true);
                startSoftProgress(0.45, 3200);
                // Classic <script src> — keeps Emscripten scriptDirectory / wasm paths correct.
                // Parallel XHR only estimates download progress (response discarded).
                try {
                    var probe = new XMLHttpRequest();
                    probe.open("GET", url, true);
                    probe.onprogress = function (e) {
                        if (hidden) return;
                        if (e.lengthComputable && e.total > 0)
                            setLoadProgress(0.04 + 0.4 * (e.loaded / e.total));
                    };
                    probe.send();
                } catch (e) {}
                var script = document.createElement("script");
                script.src = url;
                script.async = true;
                script.onerror = function () {
                    if (attempt < 2) {
                        setTimeout(function () { loadClientScript(attempt + 1); }, 900);
                    } else {
                        setLoadingMessage("加载失败：无法下载客户端脚本，请刷新重试", false);
                    }
                };
                script.onload = function () {
                    setLoadProgress(Math.max(loadProgress, 0.5));
                    setLoadingMessage("准备引擎", true);
                    startSoftProgress(0.58, 1600);
                };
                document.body.appendChild(script);
            }
            loadClientScript(0);
        });
    </script>
    </body>
</html>
